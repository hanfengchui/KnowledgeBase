server:
  port: 8080

spring:
  profiles:
    default: local
  application:
    name: knowledge-assistant-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_assistant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${BAILIAN_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        completions-path: /chat/completions
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: 0.2
      embedding:
        embeddings-path: /embeddings
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: ${AI_VECTOR_TABLE:local_vector_store}
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    com.example.knowledgeassistant: ${APP_LOG_LEVEL:INFO}

app:
  knowledge-assistant:
    top-k: 5
    similarity-threshold: 0.55
    max-chunk-chars: 900
    chunk-overlap-chars: 120
    chat-model: ${AI_CHAT_MODEL:qwen-plus}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
    vector-table-name: ${AI_VECTOR_TABLE:local_vector_store}
    vector-enabled: ${AI_VECTOR_ENABLED:true}
  security:
    jwt-secret: ${APP_JWT_SECRET:change-this-demo-secret-before-production}
    access-token-ttl-minutes: ${APP_ACCESS_TOKEN_TTL_MINUTES:120}
    bootstrap-admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:platform-admin}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}

  ai:
    mcp:
      server:
        name: knowledgehub-ai
        version: 0.1.0
        type: sync
        enabled: ${AI_MCP_SERVER_ENABLED:true}
        sse-message-endpoint: /mcp/messages
